<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Block Runner</title>
<style>
  html, body { margin: 0; height: 100%; background: #120f2e; overflow: hidden; font-family: system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = 960, H = 540;
  let scale = 1, offX = 0, offY = 0;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    scale = Math.min(innerWidth / W, innerHeight / H) * dpr;
    offX = (canvas.width - W * scale) / 2;
    offY = (canvas.height - H * scale) / 2;
  }
  addEventListener('resize', resize);
  resize();

  // ---- Tunables ----
  const GRAVITY = 2200, JUMP_V = -820, MAX_JUMPS = 2;
  const LEVELS = [430, 350, 270, 190];
  const PLAYER = { w: 30, h: 40 };
  const FONT = '"Trebuchet MS", system-ui, sans-serif';

  const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
  const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

  function rr(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ---- Static scenery ----
  const stars = Array.from({ length: 70 }, (_, i) => ({ x: hash(i) * W, y: hash(i + 99) * 220, r: hash(i + 7) * 1.4 + 0.4, t: hash(i + 3) * 6 }));
  const clouds = Array.from({ length: 7 }, (_, i) => ({ x: hash(i + 50) * (W + 300), y: 40 + hash(i + 60) * 160, s: 0.6 + hash(i + 70) * 0.8, k: 0.05 + hash(i + 80) * 0.1 }));

  // Island palettes per level
  const THEMES = [
    { grass: '#5ee36a', grassDark: '#2fae47', dirt: '#8a5a3b', dirtDark: '#5c3824', rock: '#4a3a5e' },
    { grass: '#7cf0c4', grassDark: '#2fb98c', dirt: '#7a5a8a', dirtDark: '#4d3560', rock: '#3d3566' },
    { grass: '#ffd36e', grassDark: '#e0a03a', dirt: '#a0603c', dirtDark: '#6b3a22', rock: '#553a52' },
    { grass: '#ff9ed2', grassDark: '#e0609f', dirt: '#6f5aa8', dirtDark: '#463578', rock: '#342d63' },
  ];

  let state, best = +(lsGet('blockRunnerBest') || 0);

  function makePlatform(x, lvl, w, ground) {
    const y = LEVELS[lvl];
    const depth = ground ? H - y : 26;
    const spikes = [];
    if (!ground) {
      const n = Math.max(3, Math.floor(w / 28));
      for (let i = 0; i <= n; i++) {
        const t = i / n;
        const edge = Math.sin(t * Math.PI);
        spikes.push([t * w, 30 + edge * (18 + Math.random() * Math.min(60, w * 0.22))]);
      }
    }
    const flowers = [];
    for (let fx = 14; fx < w - 10; fx += 22 + Math.random() * 40)
      flowers.push({ x: fx, kind: Math.random() < 0.6 ? 'tuft' : 'flower', c: ['#fff', '#ffe066', '#ff6b9a', '#9be7ff'][Math.floor(Math.random() * 4)] });
    return { x, y, w, h: depth, lvl, ground, spikes, flowers, theme: THEMES[lvl] };
  }

  function reset() {
    state = {
      mode: 'ready',
      speed: 300, distance: 0, coins: 0, time: 0, shake: 0,
      player: { x: 160, y: LEVELS[0] - PLAYER.h, vy: 0, jumps: 0, grounded: true, anim: 0, squash: 0, trail: [] },
      platforms: [], coinList: [], particles: [], popups: [],
      lastLevel: 0,
    };
    state.platforms.push(makePlatform(-50, 0, 700, true));
    while (rightEdge() < W + 400) spawnPlatform();
  }

  function rightEdge() {
    const p = state.platforms[state.platforms.length - 1];
    return p.x + p.w;
  }

  function spawnPlatform() {
    const s = state;
    const diff = Math.min(1, s.distance / 20000);
    let lvl = s.lastLevel;
    const r = Math.random();
    if (r < 0.35 && lvl < LEVELS.length - 1) lvl++;
    else if (r < 0.65 && lvl > 0) lvl -= 1 + Math.floor(Math.random() * lvl);
    const gap = 70 + Math.random() * (90 + 90 * diff);
    const w = 140 + Math.random() * (260 - 120 * diff);
    const x = rightEdge() + gap;
    const y = LEVELS[lvl];
    s.platforms.push(makePlatform(x, lvl, w, false));

    const prevTop = LEVELS[s.lastLevel];
    const gx0 = x - gap, n = 3 + Math.floor(gap / 60);
    for (let i = 0; i < n; i++) {
      const t = (i + 0.5) / n;
      const baseY = prevTop + (y - prevTop) * t;
      s.coinList.push({ x: gx0 + gap * t, y: baseY - 90 - Math.sin(t * Math.PI) * 70, taken: false, phase: Math.random() * 6 });
    }
    if (Math.random() < 0.5) {
      const cnt = 2 + Math.floor(Math.random() * 3);
      for (let i = 0; i < cnt; i++)
        s.coinList.push({ x: x + 30 + i * 40, y: y - 150 - Math.random() * 20, taken: false, phase: Math.random() * 6 });
    }
    s.lastLevel = lvl;
  }

  function jump() {
    if (state.mode === 'ready') state.mode = 'play';
    if (state.mode === 'over') { reset(); state.mode = 'play'; return; }
    if (state.mode !== 'play') return;
    const p = state.player;
    if (p.jumps < MAX_JUMPS) {
      p.vy = JUMP_V * (p.jumps === 0 ? 1 : 0.85);
      p.jumps++;
      p.grounded = false;
      if (p.jumps === 2) ring(p.x + PLAYER.w / 2, p.y + PLAYER.h, '#bfe9ff');
      burst(p.x + PLAYER.w / 2, p.y + PLAYER.h, ['#ffffff', '#d6f0ff'], 8, 220);
    }
  }

  function burst(x, y, colors, n, power = 300) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = power * (0.4 + Math.random() * 0.6);
      state.particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120, life: 0.6, max: 0.6,
        size: 2 + Math.random() * 3, color: colors[Math.floor(Math.random() * colors.length)] });
    }
  }
  function ring(x, y, color) { state.particles.push({ ring: true, x, y, r: 4, life: 0.35, max: 0.35, color }); }

  addEventListener('keydown', e => {
    if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); if (!e.repeat) jump(); }
    if (e.code === 'KeyP' && (state.mode === 'play' || state.mode === 'pause')) state.mode = state.mode === 'pause' ? 'play' : 'pause';
  });
  canvas.addEventListener('pointerdown', e => { e.preventDefault(); jump(); });

  function update(dt) {
    const s = state;
    s.time += dt;
    for (const c of s.coinList) c.phase += dt * 5;
    for (const c of clouds) { c.x -= (s.mode === 'play' ? s.speed : 40) * c.k * dt; if (c.x < -200) c.x = W + 150; }
    s.shake = Math.max(0, s.shake - dt * 30);
    updateFx(dt);
    if (s.mode !== 'play') return;

    s.speed = Math.min(650, 300 + s.distance / 60);
    const dx = s.speed * dt;
    s.distance += dx;

    for (const pl of s.platforms) pl.x -= dx;
    for (const c of s.coinList) c.x -= dx;
    s.platforms = s.platforms.filter(pl => pl.x + pl.w > -50);
    s.coinList = s.coinList.filter(c => c.x > -50 && !c.taken);
    while (rightEdge() < W + 400) spawnPlatform();

    const p = s.player;
    const wasGrounded = p.grounded;
    const prevBottom = p.y + PLAYER.h;
    p.vy += GRAVITY * dt;
    p.y += p.vy * dt;
    p.grounded = false;
    p.anim += dt * s.speed / 28;
    p.squash = Math.max(0, p.squash - dt * 5);

    for (const pl of s.platforms) {
      const overlapX = p.x + PLAYER.w > pl.x + 2 && p.x < pl.x + pl.w - 2;
      if (!overlapX) continue;
      const bottom = p.y + PLAYER.h;
      if (p.vy >= 0 && prevBottom <= pl.y + 1 && bottom >= pl.y) {
        if (!wasGrounded && p.vy > 300) {
          p.squash = 1;
          burst(p.x + PLAYER.w / 2, pl.y, [pl.theme.grass, '#ffffff'], 8, 160);
        }
        p.y = pl.y - PLAYER.h; p.vy = 0; p.jumps = 0; p.grounded = true;
      } else if (bottom > pl.y + 6 && p.y < pl.y + pl.h && p.x + PLAYER.w <= pl.x + dx + 4) {
        die(); return;
      }
    }

    // motion trail
    p.trail.push({ x: p.x + PLAYER.w / 2, y: p.y + PLAYER.h / 2 });
    if (p.trail.length > 10) p.trail.shift();
    for (const t of p.trail) t.x -= dx;

    for (const c of s.coinList) {
      if (Math.abs(c.x - (p.x + PLAYER.w / 2)) < 26 && Math.abs(c.y - (p.y + PLAYER.h / 2)) < 30) {
        c.taken = true; s.coins++;
        burst(c.x, c.y, ['#ffe066', '#ffd000', '#fff6c2'], 14, 260);
        ring(c.x, c.y, '#ffe066');
        s.popups.push({ x: c.x, y: c.y, text: '+50', life: 0.8 });
      }
    }

    if (p.y > H + 50) die();
  }

  function updateFx(dt) {
    const s = state;
    for (const q of s.particles) {
      q.life -= dt;
      if (q.ring) { q.r += 140 * dt; continue; }
      q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 700 * dt; q.vx *= 0.98;
    }
    s.particles = s.particles.filter(q => q.life > 0);
    for (const u of s.popups) { u.y -= 60 * dt; u.life -= dt; }
    s.popups = s.popups.filter(u => u.life > 0);
  }

  function score() { return Math.floor(state.distance / 10) + state.coins * 50; }

  function die() {
    state.mode = 'over';
    state.shake = 12;
    const p = state.player;
    burst(p.x + PLAYER.w / 2, Math.min(p.y, H - 20) + PLAYER.h / 2, ['#ff5d73', '#ffd9b3', '#3a7bd5'], 24, 380);
    const sc = score();
    if (sc > best) { best = sc; lsSet('blockRunnerBest', best); state.newBest = true; }
  }

  // ---- Rendering ----
  function draw() {
    const s = state;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#120f2e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const sx = (Math.random() - 0.5) * s.shake, sy = (Math.random() - 0.5) * s.shake;
    ctx.setTransform(scale, 0, 0, scale, offX + sx * scale, offY + sy * scale);
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();

    drawSky(s);
    drawMountains(s.distance * 0.08, 330, '#5b3f9c', '#7a5bc4');
    drawClouds();
    drawHills(s.distance * 0.2, 400, 60, '#3f2f7a', '#2c2160', 0.2);
    drawHills(s.distance * 0.4, 455, 45, '#2a2058', '#1d1645', 0.4, true);

    // light haze
    const haze = ctx.createLinearGradient(0, 300, 0, H);
    haze.addColorStop(0, 'rgba(255,170,200,0)'); haze.addColorStop(1, 'rgba(255,150,190,0.18)');
    ctx.fillStyle = haze; ctx.fillRect(0, 300, W, H - 300);

    for (const pl of s.platforms) drawPlatform(pl);
    drawShadow(s);
    for (const c of s.coinList) drawCoin(c);
    drawFx(s);
    if (s.mode !== 'over' || s.player.y < H) drawPlayer(s.player, s);

    // vignette
    const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(10,5,30,0.45)');
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);

    drawHUD(s);
    if (s.mode !== 'play') drawOverlay(s);
    ctx.restore();
  }

  function drawSky(s) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1b1446');
    g.addColorStop(0.35, '#5a2d8c');
    g.addColorStop(0.65, '#e05b9b');
    g.addColorStop(0.85, '#ffa66b');
    g.addColorStop(1, '#ffd38a');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    for (const st of stars) {
      ctx.globalAlpha = (0.4 + 0.6 * Math.abs(Math.sin(s.time * 1.5 + st.t))) * (1 - st.y / 260);
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // sun
    const sunX = 700, sunY = 235;
    const glow = ctx.createRadialGradient(sunX, sunY, 20, sunX, sunY, 260);
    glow.addColorStop(0, 'rgba(255,240,180,0.9)'); glow.addColorStop(0.25, 'rgba(255,170,120,0.35)'); glow.addColorStop(1, 'rgba(255,120,150,0)');
    ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
    const sun = ctx.createLinearGradient(0, sunY - 80, 0, sunY + 80);
    sun.addColorStop(0, '#fff3b0'); sun.addColorStop(1, '#ff7a6b');
    ctx.fillStyle = sun;
    ctx.beginPath(); ctx.arc(sunX, sunY, 80, 0, Math.PI * 2); ctx.fill();
    // retro stripes cut into the sun
    ctx.fillStyle = '#e8669a';
    for (let i = 0; i < 5; i++) ctx.fillRect(sunX - 85, sunY + 15 + i * 13, 170, 3 + i * 1.2);
  }

  function drawMountains(off, base, color, snowLine) {
    const seg = 110;
    const k0 = Math.floor(off / seg) - 1;
    const pts = [];
    for (let k = k0; k <= k0 + Math.ceil(W / seg) + 2; k++) {
      const high = (k & 1) === 0;
      pts.push([k * seg - off + hash(k) * 30, base - (high ? 110 + hash(k + 5) * 110 : 30 + hash(k + 9) * 50)]);
    }
    const g = ctx.createLinearGradient(0, base - 220, 0, base + 80);
    g.addColorStop(0, snowLine); g.addColorStop(1, color);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(pts[0][0], H);
    for (const [x, y] of pts) ctx.lineTo(x, y);
    ctx.lineTo(pts[pts.length - 1][0], H); ctx.fill();
    // snow caps
    ctx.fillStyle = 'rgba(255,235,250,0.85)';
    for (let i = 1; i < pts.length - 1; i++) {
      const [px, py] = pts[i];
      if (py > base - 150) continue;
      const [ax, ay] = pts[i - 1], [bx, by] = pts[i + 1];
      const f = 0.22;
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(px + (ax - px) * f, py + (ay - py) * f);
      ctx.lineTo(px + (ax - px) * f * 0.5, py + (ay - py) * f * 0.8);
      ctx.lineTo(px, py + (ay - py) * f * 0.6);
      ctx.lineTo(px + (bx - px) * f * 0.5, py + (by - py) * f * 0.8);
      ctx.lineTo(px + (bx - px) * f, py + (by - py) * f);
      ctx.closePath(); ctx.fill();
    }
  }

  function drawClouds() {
    for (const c of clouds) {
      ctx.save();
      ctx.translate(c.x, c.y); ctx.scale(c.s, c.s);
      ctx.fillStyle = '#f2b8d8';
      blob(0, 6);
      ctx.fillStyle = '#fff0f8';
      blob(0, 0);
      ctx.restore();
    }
    function blob(ox, oy) {
      ctx.beginPath();
      ctx.arc(ox - 40, oy + 10, 22, 0, Math.PI * 2);
      ctx.arc(ox - 10, oy - 5, 32, 0, Math.PI * 2);
      ctx.arc(ox + 28, oy + 4, 26, 0, Math.PI * 2);
      ctx.arc(ox + 55, oy + 14, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(ox - 40, oy + 10, 95, 20);
    }
  }

  function hillY(x, off, base, amp) {
    const X = x + off;
    return base - (Math.sin(X / 170) * 0.5 + 0.5) * amp - Math.sin(X / 63) * amp * 0.25;
  }

  function drawHills(off, base, amp, top, bottom, seed, trees) {
    const g = ctx.createLinearGradient(0, base - amp, 0, H);
    g.addColorStop(0, top); g.addColorStop(1, bottom);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 12) ctx.lineTo(x, hillY(x, off, base, amp));
    ctx.lineTo(W, H); ctx.fill();
    if (!trees) return;
    const sp = 55;
    const k0 = Math.floor(off / sp);
    for (let k = k0; k < k0 + W / sp + 2; k++) {
      if (hash(k + seed * 100) < 0.45) continue;
      const x = k * sp - off + hash(k + 3) * 30;
      const y = hillY(x, off, base, amp) + 4;
      const h = 30 + hash(k + 11) * 34;
      ctx.fillStyle = '#1a1340';
      ctx.fillRect(x - 2, y - 8, 4, 10);
      ctx.beginPath(); ctx.moveTo(x, y - h); ctx.lineTo(x - h * 0.3, y - 6); ctx.lineTo(x + h * 0.3, y - 6); ctx.closePath(); ctx.fill();
    }
  }

  function drawPlatform(pl) {
    const t = pl.theme, x = pl.x, y = pl.y, w = pl.w;
    if (x > W + 20 || x + w < -20) return;
    if (pl.ground) {
      const g = ctx.createLinearGradient(0, y, 0, H);
      g.addColorStop(0, t.dirt); g.addColorStop(1, t.dirtDark);
      ctx.fillStyle = g; ctx.fillRect(x, y, w, H - y);
      ctx.fillStyle = 'rgba(0,0,0,0.12)';
      for (let i = 0; i < w / 40; i++) { ctx.beginPath(); ctx.arc(x + 20 + i * 40 + (i % 2) * 12, y + 40 + (i % 3) * 25, 6, 0, Math.PI * 2); ctx.fill(); }
    } else {
      // floating island underside
      const g = ctx.createLinearGradient(0, y, 0, y + 100);
      g.addColorStop(0, t.dirt); g.addColorStop(0.4, t.dirtDark); g.addColorStop(1, t.rock);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(x, y + 6);
      for (const [sx, sy] of pl.spikes) ctx.lineTo(x + sx, y + sy);
      ctx.lineTo(x + w, y + 6); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.fillRect(x + 4, y + 14, w - 8, 3);
    }
    // grass cap
    const gg = ctx.createLinearGradient(0, y - 4, 0, y + 14);
    gg.addColorStop(0, t.grass); gg.addColorStop(1, t.grassDark);
    ctx.fillStyle = gg;
    rr(x - 3, y - 3, w + 6, 16, 7); ctx.fill();
    // drippy grass edge
    ctx.beginPath();
    for (let i = 0; i < w; i += 14) ctx.arc(x + i + 7, y + 12, 5 + ((i / 14) % 2) * 2, 0, Math.PI);
    ctx.fill();
    // top highlight
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    rr(x + 2, y - 1, w - 4, 3, 2); ctx.fill();
    // tufts & flowers
    for (const f of pl.flowers) {
      const fx = x + f.x;
      if (f.kind === 'tuft') {
        ctx.strokeStyle = t.grassDark; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(fx - 3, y); ctx.lineTo(fx - 5, y - 7);
        ctx.moveTo(fx, y); ctx.lineTo(fx, y - 9);
        ctx.moveTo(fx + 3, y); ctx.lineTo(fx + 5, y - 7);
        ctx.stroke();
      } else {
        ctx.strokeStyle = t.grassDark; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(fx, y); ctx.lineTo(fx, y - 10); ctx.stroke();
        ctx.fillStyle = f.c;
        for (let a = 0; a < 5; a++) { ctx.beginPath(); ctx.arc(fx + Math.cos(a * 1.257) * 3.5, y - 12 + Math.sin(a * 1.257) * 3.5, 2.5, 0, Math.PI * 2); ctx.fill(); }
        ctx.fillStyle = '#ffb000';
        ctx.beginPath(); ctx.arc(fx, y - 12, 2, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  function drawShadow(s) {
    const p = s.player, cx = p.x + PLAYER.w / 2;
    let top = null;
    for (const pl of s.platforms) if (cx > pl.x && cx < pl.x + pl.w && pl.y >= p.y + PLAYER.h - 1 && (top === null || pl.y < top)) top = pl.y;
    if (top === null) return;
    const d = top - (p.y + PLAYER.h);
    const k = Math.max(0.2, 1 - d / 250);
    ctx.fillStyle = `rgba(20,10,40,${0.35 * k})`;
    ctx.beginPath(); ctx.ellipse(cx, top + 1, 18 * k, 4 * k, 0, 0, Math.PI * 2); ctx.fill();
  }

  function drawCoin(c) {
    if (c.x < -30 || c.x > W + 30) return;
    const y = c.y + Math.sin(c.phase * 0.8) * 4;
    const spin = Math.cos(c.phase * 0.6);
    const sx = Math.abs(spin);
    const glow = ctx.createRadialGradient(c.x, y, 2, c.x, y, 26);
    glow.addColorStop(0, 'rgba(255,230,120,0.55)'); glow.addColorStop(1, 'rgba(255,200,80,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(c.x, y, 26, 0, Math.PI * 2); ctx.fill();

    const rx = 11 * sx + 1.5, ry = 12;
    ctx.fillStyle = '#b87400';
    ctx.beginPath(); ctx.ellipse(c.x + (spin > 0 ? 1.5 : -1.5) * (1 - sx), y + 1, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
    const g = ctx.createLinearGradient(c.x - rx, y - ry, c.x + rx, y + ry);
    g.addColorStop(0, '#fff6b0'); g.addColorStop(0.45, '#ffd23a'); g.addColorStop(1, '#e89a00');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(c.x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(180,110,0,0.8)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(c.x, y, rx * 0.62, ry * 0.65, 0, 0, Math.PI * 2); ctx.stroke();
    if (sx > 0.35) {
      ctx.fillStyle = 'rgba(180,110,0,0.9)';
      ctx.font = `bold 12px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.save(); ctx.translate(c.x, y); ctx.scale(sx, 1); ctx.fillText('★', 0, 1); ctx.restore();
      ctx.textBaseline = 'alphabetic';
    }
    // shine
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.ellipse(c.x - rx * 0.35, y - 5, rx * 0.18 + 0.5, 4, -0.4, 0, Math.PI * 2); ctx.fill();
    // twinkle
    const tw = Math.max(0, Math.sin(c.phase * 1.3));
    if (tw > 0.8) sparkle(c.x + 9, y - 10, (tw - 0.8) * 30);
  }

  function sparkle(x, y, r) {
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(x, y - r); ctx.lineTo(x + r * 0.25, y); ctx.lineTo(x, y + r); ctx.lineTo(x - r * 0.25, y); ctx.closePath();
    ctx.moveTo(x - r, y); ctx.lineTo(x, y + r * 0.25); ctx.lineTo(x + r, y); ctx.lineTo(x, y - r * 0.25); ctx.closePath();
    ctx.fill();
  }

  function drawFx(s) {
    for (const q of s.particles) {
      const a = Math.max(0, q.life / q.max);
      if (q.ring) {
        ctx.strokeStyle = q.color; ctx.globalAlpha = a; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2); ctx.stroke();
      } else {
        ctx.globalAlpha = a; ctx.fillStyle = q.color;
        ctx.beginPath(); ctx.arc(q.x, q.y, q.size * a + 0.5, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center';
    for (const u of s.popups) {
      ctx.globalAlpha = Math.min(1, u.life * 2);
      ctx.font = `bold 20px ${FONT}`;
      ctx.lineWidth = 4; ctx.strokeStyle = '#7a3d00';
      ctx.strokeText(u.text, u.x, u.y);
      ctx.fillStyle = '#ffe066';
      ctx.fillText(u.text, u.x, u.y);
    }
    ctx.globalAlpha = 1;
  }

  function drawPlayer(p, s) {
    // trail
    if (!p.grounded && s.mode === 'play') {
      p.trail.forEach((t, i) => {
        ctx.globalAlpha = (i / p.trail.length) * 0.35;
        ctx.fillStyle = '#ffb3c6';
        ctx.beginPath(); ctx.arc(t.x, t.y, 4 + i * 1.2, 0, Math.PI * 2); ctx.fill();
      });
      ctx.globalAlpha = 1;
    }
    // speed lines
    if (s.mode === 'play' && p.grounded) {
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) {
        const ly = p.y + 8 + i * 11, off = (s.time * 600 + i * 37) % 60;
        ctx.beginPath(); ctx.moveTo(p.x - 10 - off, ly); ctx.lineTo(p.x - 26 - off, ly); ctx.stroke();
      }
    }

    const stretch = p.grounded ? 0 : Math.max(-0.15, Math.min(0.15, -p.vy / 5000));
    const sqY = 1 - p.squash * 0.25 + stretch;
    const sqX = 1 + p.squash * 0.2 - stretch * 0.6;
    const cx = p.x + PLAYER.w / 2, by = p.y + PLAYER.h;
    ctx.save();
    ctx.translate(cx, by);
    ctx.scale(sqX, sqY);
    const x = -PLAYER.w / 2, y = -PLAYER.h;

    // legs
    const swing = p.grounded ? Math.sin(p.anim) * 7 : 0;
    ctx.fillStyle = '#2b2766';
    rr(x + 5 + swing, y + 28, 8, 12 - (p.grounded ? 0 : 3), 3); ctx.fill();
    rr(x + PLAYER.w - 13 - swing, y + 28, 8, 12 - (p.grounded ? 0 : 3), 3); ctx.fill();
    ctx.fillStyle = '#ffffff';
    rr(x + 3 + swing, y + 37 - (p.grounded ? 0 : 3), 12, 4, 2); ctx.fill();
    rr(x + PLAYER.w - 15 - swing, y + 37 - (p.grounded ? 0 : 3), 12, 4, 2); ctx.fill();

    // scarf trailing behind
    ctx.strokeStyle = '#ffcf33'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x + 6, y + 13);
    for (let i = 1; i <= 4; i++) ctx.lineTo(x + 6 - i * 7, y + 13 + Math.sin(s.time * 18 + i) * 3 * i * 0.6 + (p.grounded ? 0 : i * 1.5));
    ctx.stroke(); ctx.lineCap = 'butt';

    // body
    const bg = ctx.createLinearGradient(0, y + 10, 0, y + 32);
    bg.addColorStop(0, '#ff6b8a'); bg.addColorStop(1, '#d6305a');
    ctx.fillStyle = bg;
    rr(x + 1, y + 10, PLAYER.w - 2, 22, 7); ctx.fill();
    // arm
    ctx.fillStyle = '#c42a50';
    const arm = p.grounded ? Math.sin(p.anim + Math.PI) * 6 : -6;
    rr(x + 11 + arm, y + 16, 8, 12, 4); ctx.fill();

    // head
    ctx.fillStyle = '#ffdcb8';
    rr(x + 3, y - 8, PLAYER.w - 6, 20, 8); ctx.fill();
    // eye + cheek
    ctx.fillStyle = '#1d1640';
    ctx.beginPath(); ctx.ellipse(x + PLAYER.w - 10, y + 1, 2.5, 3.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x + PLAYER.w - 9.3, y - 0.2, 1, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,110,140,0.6)';
    ctx.beginPath(); ctx.arc(x + PLAYER.w - 13, y + 6, 3, 0, Math.PI * 2); ctx.fill();
    // cap
    ctx.fillStyle = '#3b82f6';
    ctx.beginPath(); ctx.arc(x + PLAYER.w / 2 - 1, y - 6, 12, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#2563c9';
    rr(x + PLAYER.w / 2 + 4, y - 8, 13, 4, 2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(x + PLAYER.w / 2 - 1, y - 17, 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function pill(x, y, w, h) {
    ctx.fillStyle = 'rgba(20,10,50,0.45)';
    rr(x, y, w, h, h / 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1.5; ctx.stroke();
  }

  function drawHUD(s) {
    ctx.textBaseline = 'middle';
    ctx.font = `bold 22px ${FONT}`;
    pill(16, 14, 170, 38);
    ctx.textAlign = 'left'; ctx.fillStyle = '#fff';
    ctx.fillText(`${score()}`, 34, 34);
    ctx.font = `bold 11px ${FONT}`; ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillText('SCORE', 130, 34);

    pill(16, 60, 110, 38);
    // mini coin
    const g = ctx.createLinearGradient(30, 68, 46, 90);
    g.addColorStop(0, '#fff6b0'); g.addColorStop(1, '#e89a00');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(38, 79, 10, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#b87400'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.font = `bold 22px ${FONT}`; ctx.fillStyle = '#ffe066';
    ctx.fillText(`× ${s.coins}`, 56, 80);

    ctx.font = `bold 18px ${FONT}`;
    const bt = `🏆 ${best}`;
    const bw = ctx.measureText(bt).width + 32;
    pill(W - 16 - bw, 14, bw, 38);
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    ctx.fillText(bt, W - 16 - bw / 2, 34);
    ctx.textBaseline = 'alphabetic';
  }

  function drawOverlay(s) {
    ctx.fillStyle = 'rgba(15,8,40,0.5)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    const title = s.mode === 'ready' ? 'BLOCK RUNNER' : s.mode === 'pause' ? 'PAUSED' : 'GAME OVER';
    const bob = Math.sin(s.time * 2.5) * 5;
    ctx.font = `900 68px ${FONT}`;
    ctx.lineJoin = 'round';
    ctx.lineWidth = 12; ctx.strokeStyle = '#2a1458';
    ctx.strokeText(title, W / 2, H / 2 - 40 + bob + 6);
    ctx.strokeText(title, W / 2, H / 2 - 40 + bob);
    const tg = ctx.createLinearGradient(0, H / 2 - 100, 0, H / 2 - 30);
    tg.addColorStop(0, '#fff6b0'); tg.addColorStop(0.5, '#ffcf33'); tg.addColorStop(1, '#ff7a3d');
    ctx.fillStyle = tg;
    ctx.fillText(title, W / 2, H / 2 - 40 + bob);

    ctx.font = `bold 22px ${FONT}`;
    if (s.mode === 'over') {
      ctx.fillStyle = '#fff';
      ctx.fillText(`Score ${score()}   ·   Coins ${s.coins}`, W / 2, H / 2 + 15);
      if (s.newBest) { ctx.fillStyle = '#7cf0c4'; ctx.fillText('★ NEW BEST! ★', W / 2, H / 2 + 48); }
    } else if (s.mode === 'ready') {
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.font = `18px ${FONT}`;
      ctx.fillText('Jump across the floating islands and grab the coins in mid-air', W / 2, H / 2 + 12);
    }
    {
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(s.time * 5);
      ctx.font = `bold 20px ${FONT}`;
      const hint = s.mode === 'pause' ? 'Press P to resume'
        : s.mode === 'over' ? 'Press SPACE or tap to retry'
        : 'Press SPACE / ↑ or tap  ·  double-jump in the air';
      const hw = ctx.measureText(hint).width + 40;
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      rr(W / 2 - hw / 2, H / 2 + 72, hw, 40, 20); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.fillText(hint, W / 2, H / 2 + 99);
      ctx.globalAlpha = 1;
    }
  }

  // ---- Loop ----
  reset();
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
